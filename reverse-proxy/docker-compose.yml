services:
  caddy:
    image: ghcr.io/caddybuilds/caddy-cloudflare:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker_data/data:/data
      - ./docker_data/config:/config
    env_file:
      - .env
    networks:
      - proxy

networks:
  proxy:
    name: proxy